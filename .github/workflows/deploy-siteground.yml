name: Deploy SiteGround (splash)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Evita dos deploys simultáneos pisándose
concurrency:
  group: deploy-siteground
  cancel-in-progress: false

env:
  # Carpeta destino. El rsync --delete SOLO actúa aquí, nunca en public_html.
  REMOTE_DIR: www/aluna.gt/public_html/splash/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_BASE: /splash/

      - name: Generar .htaccess de caché
        run: |
          # HTML sin caché (cada deploy se ve de inmediato)
          cat > dist/.htaccess <<'EOF'
          <IfModule mod_headers.c>
            <FilesMatch "\.html$">
              Header set Cache-Control "no-cache, no-store, must-revalidate"
            </FilesMatch>
          </IfModule>
          EOF
          # Solo assets con hash: caché de un año
          cat > dist/assets/.htaccess <<'EOF'
          <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=31536000, immutable"
          </IfModule>
          EOF

      - name: Verificar build
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html no existe"; exit 1; }
          # Confirma que los assets apuntan a /splash/
          grep -q '/splash/assets/' dist/index.html || { echo "::error::VITE_BASE no se aplicó (revisa vite.config.ts)"; exit 1; }

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SG_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SG_PORT }}" "${{ secrets.SG_HOST }}" >> ~/.ssh/known_hosts

      - name: Subir con rsync
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SG_PORT }}" \
            dist/ "${{ secrets.SG_USER }}@${{ secrets.SG_HOST }}:${REMOTE_DIR}"

      - name: Purgar caché de SiteGround
        run: |
          ssh -p "${{ secrets.SG_PORT }}" "${{ secrets.SG_USER }}@${{ secrets.SG_HOST }}" \
            "cd www/aluna.gt/public_html && wp sg purge" \
            || echo "::warning::No se pudo purgar la caché de SiteGround"
